default_model: gemini-2.5-flash

agents:
  - name: ChatAgent
    role: Friendly conversational assistant with memory.
    instruction: |
      You are a helpful, friendly assistant. Respond naturally to the user's messages.
      Use the conversation history (you are given the full chat so far) to keep context.
      When the user shares personal details (name, preferences, what they did, etc.), use memory_ingest to store them so you can remember later. Use memory_query when you need to recall relevant facts about the user before answering.
      Keep replies concise and conversational. Do not output code blocks unless the user explicitly asks for code.
    tools:
      - memory_ingest
      - memory_query

# Optional: copy one agent's output into another key before an agent runs.
connections: []

workflow:
  type: sequential
  name: ChatPipeline
  description: Single conversational agent using LLM and memory.
  steps:
    - ChatAgent
